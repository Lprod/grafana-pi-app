services:
  history-generator:
    image: python:3.14-slim
    working_dir: /repo
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -eu
        END_TIMESTAMP="$${HISTORY_END_TIMESTAMP:-$$(date +%s)}"
        python demo/prometheus/generate_openmetrics.py --output /demo/history.openmetrics --end-timestamp "$$END_TIMESTAMP"
        python demo/influx/generate_line_protocol.py --output /demo/history.lp --end-timestamp "$$END_TIMESTAMP"
    environment:
      HISTORY_HOURS: '${HISTORY_HOURS:-6}'
      HISTORY_STEP_SECONDS: '${HISTORY_STEP_SECONDS:-60}'
      INCIDENT_DURATION_SECONDS: '${INCIDENT_DURATION_SECONDS:-900}'
      HISTORY_FUTURE_SECONDS: '${HISTORY_FUTURE_SECONDS:-3600}'
    volumes:
      - .:/repo:ro
      - demo-data:/demo

  prometheus-init:
    image: prom/prometheus:v3.7.3
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        if find /prometheus -mindepth 1 -maxdepth 1 | read; then
          echo "Prometheus data already exists; skipping historical import."
        else
          promtool tsdb create-blocks-from openmetrics /demo/history.openmetrics /prometheus
        fi
    volumes:
      - demo-data:/demo:ro
      - prometheus-data:/prometheus
    depends_on:
      history-generator:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v3.7.3
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=12h'
      - '--web.enable-lifecycle'
    volumes:
      - ./demo/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '9090:9090'
    depends_on:
      prometheus-init:
        condition: service_completed_successfully

  influxdb:
    image: influxdb:1.8
    environment:
      INFLUXDB_DB: observability
    volumes:
      - influxdb-data:/var/lib/influxdb
    ports:
      - '8086:8086'
    healthcheck:
      test: ['CMD-SHELL', "influx -execute 'SHOW DATABASES' >/dev/null 2>&1"]
      interval: 2s
      timeout: 2s
      retries: 30

  influxdb-init:
    image: influxdb:1.8
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -eu
        if influx -host influxdb -database observability -execute 'SHOW MEASUREMENTS' -format csv | grep -q ',http_requests_total'; then
          echo "InfluxDB data already exists; skipping historical import."
        else
          influx -host influxdb -execute 'CREATE DATABASE "observability"'
          curl -sS -f -XPOST 'http://influxdb:8086/write?db=observability&precision=s' --data-binary @/demo/history.lp
        fi
    volumes:
      - demo-data:/demo:ro
    depends_on:
      history-generator:
        condition: service_completed_successfully
      influxdb:
        condition: service_healthy

  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    container_name: 'g42-pi-app'
    build:
      args:
        grafana_version: ${GRAFANA_VERSION:-13.0.1}
    depends_on:
      prometheus:
        condition: service_started
      influxdb-init:
        condition: service_completed_successfully
      renderer:
        condition: service_started
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      GF_LOG_FILTERS: plugin.g42-pi-app:debug
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: g42-pi-app
      GF_FEATURE_TOGGLES_ENABLE: externalServiceAccounts
      GF_AUTH_MANAGED_SERVICE_ACCOUNTS_ENABLED: 'true'
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      OPENAI_API_KEY: ${OPENAI_API_KEY:-local-dev-key}

  renderer:
    image: grafana/grafana-image-renderer:${GRAFANA_IMAGE_RENDERER_VERSION:-latest}
    environment:
      ENABLE_METRICS: 'true'

volumes:
  demo-data:
  prometheus-data:
  influxdb-data:

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ['grafana:3000']

  - job_name: grafana_plugin_g42_pi_app
    metrics_path: /metrics/plugins/g42-pi-app
    static_configs:
      - targets: ['grafana:3000']

apiVersion: 1

apps:
  - type: '$__env{PI_PLUGIN_ID}'
    org_id: 1
    org_name: 'elohmeier'
    disabled: false
    jsonData:
      openAIBaseUrl: $__env{PI_OPENAI_BASE_URL}
      defaultModel: $__env{PI_DEFAULT_MODEL}
      thinkingLevel: $__env{PI_THINKING_LEVEL}
      thinkingFormat: $__env{PI_THINKING_FORMAT}
      accessMode: all
      allowedUsers: []
      systemPromptAddendum: ''
      isOpenAIAPIKeySet: true
      allowedPrometheusDatasourceUids: ['prometheus']
      customSkills: []
    secureJsonData:
      openAIAPIKey: $__env{OPENAI_API_KEY}
